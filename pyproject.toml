[project]
name = "guillotine"
version = "0.1.0"
description = "A modular AI assistant designed to simplify AI interactions."
readme = "README.md"
authors = [
    { name = "Guilherme Cordeiro", email = "guilherme.cordeiro.da.silva000@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
guillotine = "guillotine:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "commitizen>=4.19.3",
    "pre-commit>=4.7.0",
    "python-semantic-release>=10.7.0",
]

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.1.0"
tag_format = "v$version"
version_files = [
    "pyproject.toml:project.version"
]
update_changelog_on_bump = true

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
branch = "main"
tag_format = "v{version}"
changelog_file = "CHANGELOG.md"
commit_parser = "conventional"
build_command = "uv build"
