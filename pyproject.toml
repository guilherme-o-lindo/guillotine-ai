[project]
name = "guillotine"
version = "0.1.0"
description = "A modular AI assistant designed to simplify AI interactions."
readme = "README.md"
authors = [
    { name = "Guilherme Cordeiro", email = "guilherme.cordeiro.da.silva000@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.20.1",
    "anyio>=4.16.0",
    "langgraph>=1.2.20",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "mcp>=2.3.0",
    "openai>=3.46.0",
    "opentelemetry-api>=1.45.2",
    "opentelemetry-exporter-otlp>=1.45.2",
    "opentelemetry-sdk>=1.45.2",
    "playwright>=1.64.1",
    "pydantic-ai>=2.66.0",
    "python-dotenv>=1.2.4",
    "sentry-sdk>=2.74.0",
    "sqlalchemy>=2.1.8",
    "structlog>=26.1.0",
    "tenacity>=9.1.4",
    "tzdata>=2026.6",
]

[project.scripts]
guillotine = "guillotine.main:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "commitizen>=4.19.3",
    "pre-commit>=4.7.0",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "pytest-playwright>=0.10.0",
    "python-semantic-release>=10.7.0",
    "ruff>=0.17.4",
]

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.1.0"
tag_format = "v$version"
version_files = [
    "pyproject.toml:project.version"
]
update_changelog_on_bump = true

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
branch = "main"
tag_format = "v{version}"
changelog_file = "CHANGELOG.md"
commit_parser = "conventional"
build_command = "uv build"

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = [
    "E",    # Erros de estilo
    "F",    # Pyflakes
    "I",    # Organização de imports
    "UP",   # Modernização de sintaxe
    "B",    # Bugbear
    "SIM",  # Simplificações
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["src", "test"]
venvPath = "."
venv = ".venv"
reportMissingTypeStubs = "none"
