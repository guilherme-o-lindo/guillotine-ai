[project]
name = "guillotine"
version = "0.2.0"
description = "A modular AI assistant designed to simplify AI interactions."
readme = "README.md"
authors = [
    { name = "Guilherme Cordeiro", email = "guilherme.cordeiro.da.silva000@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.20.1",
    "anyio>=4.16.0",
    "httpx2>=2.16.0",
    "langgraph>=1.2.20",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "mcp>=2.3.0",
    "openai>=3.46.0",
    "opentelemetry-api>=1.45.2",
    "opentelemetry-exporter-otlp>=1.45.2",
    "opentelemetry-sdk>=1.45.2",
    "playwright>=1.65.1",
    "pydantic-ai>=2.66.0",
    "python-dotenv>=1.2.4",
    "sentry-sdk>=2.74.0",
    "sqlalchemy>=2.1.8",
    "structlog>=26.1.0",
    "tenacity>=9.1.4",
    "truststore>=0.10.5",
    "tzdata>=2026.6",
]

[project.scripts]
guillotine-dev = "guillotine.dev_cli:app"
guillotine = "guillotine.main:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "allure-pytest>=2.16.2",
    "bandit>=1.9.4",
    "commitizen>=4.19.3",
    "httpx>=0.28.1",
    "hypothesis>=6.170.15",
    "locust>=2.47.0",
    "pip-audit>=2.10.1",
    "pre-commit>=4.7.0",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "pytest-cov>=7.1.0",
    "pytest-playwright>=0.10.0",
    "python-semantic-release>=10.7.0",
    "ruff>=0.17.4",
    "schemathesis>=4.33.4",
    "testcontainers>=4.15.0",
    "typer>=0.29.1",
]

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.1.0"
tag_format = "v$version"
version_files = [
    "pyproject.toml:project.version"
]
update_changelog_on_bump = true

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
tag_format = "v{version}"
commit_parser = "conventional"
commit_message = "chore(release): {version}"
build_command = "uv build"
allow_zero_version = true

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.md"

[tool.semantic_release.branches.main]
match = "main"
prerelease = false

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = [
    "E",    # Erros de estilo
    "F",    # Pyflakes
    "I",    # Organização de imports
    "UP",   # Modernização de sintaxe
    "B",    # Bugbear
    "SIM",  # Simplificações
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["src", "tests"]
venvPath = "."
venv = ".venv"
reportMissingTypeStubs = "none"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
markers = ["unit: testes unitarios sem servicos externos", "integration: testes envolvendo banco ou servicos integrados", "e2e: testes ponta a ponta", "contract: testes de contrato de API", "security: testes de seguranca", "slow: testes custosos ou de longa duracao"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 85
[tool.coverage.run]
source = ["guillotine"]
branch = true
