
name: QA

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Code Quality & Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      GUILLOTINE_MODEL: qa-test-model
      GUILLOTINE_API_KEY: qa-test-key

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --locked --group dev

      - name: Ruff — Lint
        run: uv run --frozen ruff check .

      - name: Ruff — Format
        run: uv run --frozen ruff format --check .

      - name: Pyright
        run: uv run --frozen pyright

      - name: Pytest + Coverage + Allure
        run: >
          uv run --frozen pytest
          --cov
          --cov-report=term-missing
          --cov-report=xml:coverage.xml
          --alluredir=allure-results
          --clean-alluredir

      - name: Upload QA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-results-${{ github.run_id }}
          path: |
            coverage.xml
            allure-results/
          retention-days: 14
          if-no-files-found: warn

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --locked --group dev

      - name: Bandit — Medium/High
        run: uv run --frozen bandit -r src/guillotine -ll

      - name: Dependency Audit
        run: uv run --frozen pip-audit